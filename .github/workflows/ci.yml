name: CI / Security & Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Python dependencies
        run: python -m pip install -r backend/requirements.txt bandit safety
      - name: Bandit
        run: bandit -r backend/ -ll
      - name: Safety
        run: safety check -r backend/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Frontend install
        working-directory: frontend
        run: npm install
      - name: NPM audit
        working-directory: frontend
        run: npm audit --audit-level=high

  tests:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./... -count=1
      - name: Go build
        run: go build ./...
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Python tests
        working-directory: backend
        run: python -m pytest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Frontend tests
        working-directory: frontend
        run: npm install && npm run test -- --run
      - name: Frontend build
        working-directory: frontend
        run: npm run build
